name: Verify published atelier logos
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify all nine public sites from GitHub network
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json,base64,hashlib,urllib.request,concurrent.futures,time
          manifest=json.loads(base64.b64decode(""))
          def check(job):
              entry,item=job
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(entry['public_url']+item['path']+'?v='+entry['commit'],headers={'User-Agent':'AtelierLogoDeploymentCheck/1.0','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(request,timeout=12) as response:
                          content=response.read();status=response.status
                      actual=hashlib.sha256(content).hexdigest()
                      if status==200 and actual==item['sha256']:
                          return {'repository':entry['repository'],'path':item['path'],'ok':True}
                      error='HTTP '+str(status)+' or hash mismatch'
                  except Exception as ex:error=str(ex)
                  if attempt<2:time.sleep(3)
              return {'repository':entry['repository'],'path':item['path'],'ok':False,'error':error}
          jobs=[(entry,item) for entry in manifest for item in entry['files']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:results=list(pool.map(check,jobs))
          report={'ok':all(r['ok'] for r in results),'passed':sum(r['ok'] for r in results),'total':len(results),'checks':results}
          print('ATELIER_LOGO_VERIFICATION_JSON='+json.dumps(report,separators=(',',':')))
          raise SystemExit(0 if report['ok'] else 1)
          PYVERIFY
