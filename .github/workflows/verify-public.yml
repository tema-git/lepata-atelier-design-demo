name: Verify public demo assets
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check anonymous HTTPS and deployed file hashes
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json, hashlib, urllib.request, concurrent.futures, time
          manifest = json.loads('[{"site":"lepata-atelier-design-demo","url":"https://tema-git.github.io/lepata-atelier-design-demo/","files":[{"path":"index.html","sha256":"ff7215ae04312f20cb67283d15fcca44fe023c8409af73a0b58d62ec8f61e237"},{"path":"style.css","sha256":"de8c68fabd341d36f3347105e5b8d6bdc8e644097f67ba16e85ff9fcf11ace76"},{"path":"fonts.css","sha256":"52c64e7905d165fec3675cef95a6f916ef296c58560bcb8ad21c1a7791d130ca"},{"path":"app.js","sha256":"b98abe2e962017e523d51ebc1abc0e8adbda5e0b0f3f861340974a4c4c759428"},{"path":"hero-game.css","sha256":"21ea5428f5e384b69713c904c19cf5a33609b23dc367e9a4958641c6612677d8"},{"path":"hero-game.js","sha256":"38dc8051e89534135b346c82fb591620bbbcdd48731d4230db4e179c470b9229"},{"path":"atelier-motion.css","sha256":"da9e1751e8acd5d72a4ab7f469abe1b603499ebfa728445096d5015c792f203a"},{"path":"atelier-motion.js","sha256":"29c415e3cfba1407ceb0c9ddd91dd489eb780ce3b4060dd0eea33b8d9a00f8bc"},{"path":"second-life.css","sha256":"49eec3d5ec2f48d54cc14cd24b4b0743b6d1197ea762ad6580de43ac6734d8fd"},{"path":"second-life.js","sha256":"ccbbc53e234a20806c5ae066540a5f48e0e140e1d85975653a3a2672bba2a93c"},{"path":"assets/upcycle.svg","sha256":"048db96e250b1b5acaf0ead5d8eb6408231a18628a5a4ac784894fac33300fc5"},{"path":"assets/garments.svg","sha256":"1825c9006e6a4c565986e3f71952d02eac6e8c6120ff36cdaff5d95812db797f"},{"path":"assets/favicon.svg","sha256":"e52801b5fe75f885003083c498fa135467f221fa65d245c0c33e5db2006c1ad4"},{"path":"assets/vendor/gsap.min.js","sha256":"92bb9a96476f983d212a2bc4f54c889039c1696dd4461d40a736860938570fbb"},{"path":"assets/vendor/ScrollTrigger.min.js","sha256":"b0b14d67b55b0c43c756ac0b106cfcb09d0879945f6ead64451065b0672916a2"},{"path":"assets/font-0.woff2","sha256":"70cf502d77aa23c8a573db8853f20a8db705d18414d170f257a9e939113aad47"},{"path":"assets/font-1.woff2","sha256":"17d048ca05cb1218af3c0d6dcdf882989e6d1cc5dcb598ea50eaf54850ff7229"},{"path":"assets/font-2.woff2","sha256":"05befabe4813f41238ce6ea4f5ecd6b758591e9ef2f303a9932bff68ba66dc66"},{"path":"assets/font-3.woff2","sha256":"9a69d0aa4734c4022224c002a3d944a702e0204972a49d892789f5668b922c2a"},{"path":"assets/font-4.woff2","sha256":"1a71ca94e943aac8154d195f9ea21959d374ebf3a3a9420651d0dbb46253f897"},{"path":"assets/font-5.woff2","sha256":"3392de5a383deac60effcad2beb8b847f40eb0eb200ffd4888c3e13d6e40845f"},{"path":"assets/font-6.woff2","sha256":"60aab7caa7ea16a76672583f1db7f2e7ea17ee205e00e1c1027a06cc548a6a9b"},{"path":"assets/font-7.woff2","sha256":"1b85a8c794709747c9f689b791984c430a2d9716a5cf9440d955bd7d20dad9d0"}]}]')
          def check(job):
              site, base, item = job
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+item['path'],headers={'User-Agent':'WebsiteDeploymentCheck/1.0','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(request,timeout=15) as r:
                          body=r.read(); status=r.status; final=r.geturl()
                      actual=hashlib.sha256(body).hexdigest()
                      if status==200 and final.startswith('https://') and actual==item['sha256']:
                          return {'site':site,'path':item['path'],'ok':True,'status':status}
                      error='HTTP '+str(status)+' or hash mismatch'
                  except Exception as e: error=str(e)
                  if attempt<3:time.sleep(5)
              return {'site':site,'path':item['path'],'ok':False,'error':error}
          jobs=[(s['site'],s['url'],f) for s in manifest for f in s['files']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool: results=list(pool.map(check,jobs))
          print('PUBLIC_VERIFICATION_JSON='+json.dumps(results,separators=(',',':')))
          for s in manifest:
              values=[r for r in results if r['site']==s['site']]
              print(s['url']+' '+str(sum(r['ok'] for r in values))+'/'+str(len(values))+' files verified')
          raise SystemExit(0 if all(r['ok'] for r in results) else 1)
          PYVERIFY
