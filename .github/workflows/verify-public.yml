name: Verify public demo assets
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check anonymous HTTPS and deployed file hashes
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json, hashlib, urllib.request, concurrent.futures, time
          manifest = json.loads('[{"site":"ze-tsvety-flowers-design-demo","url":"https://tema-git.github.io/ze-tsvety-flowers-design-demo/","files":[{"path":"DESIGN.md","sha256":"340cbff0338a81c13ebf7b078c7d5f9daacefade22f6004ae7581c3ad50d1a9e"},{"path":"README.md","sha256":"f77f1cc5e427c3b284e4f54c1be344055eeeefd20f589994c9b67df40f11c1fb"},{"path":"SOURCE.json","sha256":"50743fe6889baf7f340f03e1f22b66e3c827e79630dfd84e9788eefc99640d84"},{"path":"app.js","sha256":"9b746af0095e7bc2ec00120035f89cf5f908de619cd79a68302ed05a0ee6fc42"},{"path":"assets/favicon.svg","sha256":"e0e6c5a283e5855b31f96fde0f27a49b7aeabfcaca935e8207a6c70b5feed0f2"},{"path":"assets/floral-hero.png","sha256":"59ae076d34630ff1a8dbbf433519dcc0f41dcc3cca3f39a1ce442142d3994c10"},{"path":"assets/font-0.woff2","sha256":"70cf502d77aa23c8a573db8853f20a8db705d18414d170f257a9e939113aad47"},{"path":"assets/font-1.woff2","sha256":"17d048ca05cb1218af3c0d6dcdf882989e6d1cc5dcb598ea50eaf54850ff7229"},{"path":"assets/font-2.woff2","sha256":"05befabe4813f41238ce6ea4f5ecd6b758591e9ef2f303a9932bff68ba66dc66"},{"path":"assets/font-3.woff2","sha256":"9a69d0aa4734c4022224c002a3d944a702e0204972a49d892789f5668b922c2a"},{"path":"assets/font-4.woff2","sha256":"1a71ca94e943aac8154d195f9ea21959d374ebf3a3a9420651d0dbb46253f897"},{"path":"assets/font-5.woff2","sha256":"3392de5a383deac60effcad2beb8b847f40eb0eb200ffd4888c3e13d6e40845f"},{"path":"assets/font-6.woff2","sha256":"60aab7caa7ea16a76672583f1db7f2e7ea17ee205e00e1c1027a06cc548a6a9b"},{"path":"assets/font-7.woff2","sha256":"1b85a8c794709747c9f689b791984c430a2d9716a5cf9440d955bd7d20dad9d0"},{"path":"assets/rose-mark.svg","sha256":"5fcb9f4b3e1e009df7acbf646751de7437dd2be2302199a836f60a1daeb59706"},{"path":"assets/vendor/ScrollTrigger.min.js","sha256":"b0b14d67b55b0c43c756ac0b106cfcb09d0879945f6ead64451065b0672916a2"},{"path":"assets/vendor/gsap.min.js","sha256":"92bb9a96476f983d212a2bc4f54c889039c1696dd4461d40a736860938570fbb"},{"path":"fonts.css","sha256":"52c64e7905d165fec3675cef95a6f916ef296c58560bcb8ad21c1a7791d130ca"},{"path":"index.html","sha256":"af9db1625474c3b2050fd3cca713c591ac4554860fa07e63f1fcca601a20e0b7"},{"path":"robots.txt","sha256":"331ea9090db0c9f6f597bd9840fd5b171830f6e0b3ba1cb24dfa91f0c95aedc1"},{"path":"style.css","sha256":"38c4c78cd9605056cf23fe8a410de76bd516375818f1081ea9a9e71b3400a771"}]},{"site":"lepata-atelier-design-demo","url":"https://tema-git.github.io/lepata-atelier-design-demo/","files":[{"path":"DESIGN.md","sha256":"7e03fb372419223af7a45ea4c980b5a61d567aa672815e77fd0773d1e014044a"},{"path":"README.md","sha256":"5986aee6c81e55cf884e41af3995cb0bc7b4834a6a677019eed77274f68c5ff0"},{"path":"SOURCE.json","sha256":"cfdb14fda4cd5589a58aa5f2c3dd1c431cc1e8ed6fe09678311b2fe2381f1b3f"},{"path":"app.js","sha256":"daa4e9c6beac4b92b1a0c3c3c86db89b3d661695208235906eab0610fb7c49d8"},{"path":"assets/atelier-hero.png","sha256":"55c4f7c45bbc2f141f202f35e68d08f0476f3ca7dd28b6c0d56a26268f33f005"},{"path":"assets/favicon.svg","sha256":"e52801b5fe75f885003083c498fa135467f221fa65d245c0c33e5db2006c1ad4"},{"path":"assets/font-0.woff2","sha256":"70cf502d77aa23c8a573db8853f20a8db705d18414d170f257a9e939113aad47"},{"path":"assets/font-1.woff2","sha256":"17d048ca05cb1218af3c0d6dcdf882989e6d1cc5dcb598ea50eaf54850ff7229"},{"path":"assets/font-2.woff2","sha256":"05befabe4813f41238ce6ea4f5ecd6b758591e9ef2f303a9932bff68ba66dc66"},{"path":"assets/font-3.woff2","sha256":"9a69d0aa4734c4022224c002a3d944a702e0204972a49d892789f5668b922c2a"},{"path":"assets/font-4.woff2","sha256":"1a71ca94e943aac8154d195f9ea21959d374ebf3a3a9420651d0dbb46253f897"},{"path":"assets/font-5.woff2","sha256":"3392de5a383deac60effcad2beb8b847f40eb0eb200ffd4888c3e13d6e40845f"},{"path":"assets/font-6.woff2","sha256":"60aab7caa7ea16a76672583f1db7f2e7ea17ee205e00e1c1027a06cc548a6a9b"},{"path":"assets/font-7.woff2","sha256":"1b85a8c794709747c9f689b791984c430a2d9716a5cf9440d955bd7d20dad9d0"},{"path":"assets/silhouettes.svg","sha256":"8c3831455522fa3c02f6428cdbcb9e0044bc37bc49142bfab9bf0838bd77e5c6"},{"path":"assets/vendor/ScrollTrigger.min.js","sha256":"b0b14d67b55b0c43c756ac0b106cfcb09d0879945f6ead64451065b0672916a2"},{"path":"assets/vendor/gsap-source.json","sha256":"30ea2d0b5c2321c2035ca07d6eae3d9e46e5a8f48f4f96d2bf4b3c2c20c46130"},{"path":"assets/vendor/gsap.min.js","sha256":"92bb9a96476f983d212a2bc4f54c889039c1696dd4461d40a736860938570fbb"},{"path":"fonts.css","sha256":"52c64e7905d165fec3675cef95a6f916ef296c58560bcb8ad21c1a7791d130ca"},{"path":"index.html","sha256":"594196a48a2c3412746a7e6ed5fb4508835a51d9dad15499f07a5b011e021344"},{"path":"robots.txt","sha256":"331ea9090db0c9f6f597bd9840fd5b171830f6e0b3ba1cb24dfa91f0c95aedc1"},{"path":"studio.js","sha256":"6bcf62da4e1b3681d7548f9106488ee0e87cb13cddad34afeb9b67ed304ffa8e"},{"path":"style.css","sha256":"b6370bfd088d27f76eaf7fe8d65c0108ffdfd0a07f980f06d4d0c99555925fb8"}]}]')
          def check(job):
              site, base, item = job
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+item['path'],headers={'User-Agent':'WebsiteDeploymentCheck/1.0','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(request,timeout=15) as r:
                          body=r.read(); status=r.status; final=r.geturl()
                      actual=hashlib.sha256(body).hexdigest()
                      if status==200 and final.startswith('https://') and actual==item['sha256']:
                          return {'site':site,'path':item['path'],'ok':True,'status':status}
                      error='HTTP '+str(status)+' or hash mismatch'
                  except Exception as e: error=str(e)
                  if attempt<3:time.sleep(5)
              return {'site':site,'path':item['path'],'ok':False,'error':error}
          jobs=[(s['site'],s['url'],f) for s in manifest for f in s['files']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool: results=list(pool.map(check,jobs))
          print('PUBLIC_VERIFICATION_JSON='+json.dumps(results,separators=(',',':')))
          for s in manifest:
              values=[r for r in results if r['site']==s['site']]
              print(s['url']+' '+str(sum(r['ok'] for r in values))+'/'+str(len(values))+' files verified')
          raise SystemExit(0 if all(r['ok'] for r in results) else 1)
          PYVERIFY
