name: Verify public demo assets
on: workflow_dispatch
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check anonymous HTTPS and deployed file hashes
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import json, hashlib, urllib.request, concurrent.futures, time
          manifest = json.loads('[{"site":"lepata-atelier-design-demo","url":"https://tema-git.github.io/lepata-atelier-design-demo/","files":[{"path":"index.html","sha256":"9873c5cd4ad989981561cc84150f5cc4cdcfa6f50a451b29e4b20aca2e494a58"},{"path":"style.css","sha256":"2145c8d203b71d0c8d42fa2e2fef1e30a10cade499d010214ee6c4cae54ea904"},{"path":"fonts.css","sha256":"52c64e7905d165fec3675cef95a6f916ef296c58560bcb8ad21c1a7791d130ca"},{"path":"app.js","sha256":"af921652e587c5ce7e1a25ce73c3b3cac187f4ba78316b90e5b7d9efd469ff82"},{"path":"atelier-cursor.js","sha256":"d07564675aa89f83361baf326f256897676c9293e13dd761c4bcdd92d8dd1910"},{"path":"hero-game.css","sha256":"564855dda6a0766fa671b0d8be57815710f325df1b50067f2afa570ceb198d68"},{"path":"hero-game.js","sha256":"ad877175e52f69dcc0cf0705e3886c5a1c0dba8e8f662ab6d6a78602233ec487"},{"path":"atelier-motion.css","sha256":"1f136ea0382cbe79c5dfc7d365a66bcf60165a91174cabe7e808b7e899de43f2"},{"path":"atelier-motion.js","sha256":"0912c281507bdae2fb480b5d8cf959318963d598ea903be56b29ec49d11fbdef"},{"path":"second-life.css","sha256":"15f4e41c7553a9114b689ecc3546bb7377d00095deb25388ce1a0ea2b3a41b99"},{"path":"second-life.js","sha256":"7da999bce7910cf73b76450e10877f8e5be470e1086ba574bcd0a93bc0738933"},{"path":"assets/upcycle.svg","sha256":"048db96e250b1b5acaf0ead5d8eb6408231a18628a5a4ac784894fac33300fc5"},{"path":"assets/garments.svg","sha256":"1825c9006e6a4c565986e3f71952d02eac6e8c6120ff36cdaff5d95812db797f"},{"path":"assets/favicon.svg","sha256":"d39515e26e85eb7c64ac0c04a61f24102ea71e5eae42fafd9059f54de67d7a62"},{"path":"assets/needle-cursor.svg","sha256":"09d39072a86a6fa28d4025ecf910a4b2aabc5b11719baaa50142cb070cf287cd"},{"path":"assets/vendor/gsap.min.js","sha256":"92bb9a96476f983d212a2bc4f54c889039c1696dd4461d40a736860938570fbb"},{"path":"assets/vendor/ScrollTrigger.min.js","sha256":"b0b14d67b55b0c43c756ac0b106cfcb09d0879945f6ead64451065b0672916a2"},{"path":"assets/font-0.woff2","sha256":"70cf502d77aa23c8a573db8853f20a8db705d18414d170f257a9e939113aad47"},{"path":"assets/font-1.woff2","sha256":"17d048ca05cb1218af3c0d6dcdf882989e6d1cc5dcb598ea50eaf54850ff7229"},{"path":"assets/font-2.woff2","sha256":"05befabe4813f41238ce6ea4f5ecd6b758591e9ef2f303a9932bff68ba66dc66"},{"path":"assets/font-3.woff2","sha256":"9a69d0aa4734c4022224c002a3d944a702e0204972a49d892789f5668b922c2a"},{"path":"assets/font-4.woff2","sha256":"1a71ca94e943aac8154d195f9ea21959d374ebf3a3a9420651d0dbb46253f897"},{"path":"assets/font-5.woff2","sha256":"3392de5a383deac60effcad2beb8b847f40eb0eb200ffd4888c3e13d6e40845f"},{"path":"assets/font-6.woff2","sha256":"60aab7caa7ea16a76672583f1db7f2e7ea17ee205e00e1c1027a06cc548a6a9b"},{"path":"assets/font-7.woff2","sha256":"1b85a8c794709747c9f689b791984c430a2d9716a5cf9440d955bd7d20dad9d0"}]}]')
          def check(job):
              site, base, item = job
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(base+item['path'],headers={'User-Agent':'WebsiteDeploymentCheck/1.0','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(request,timeout=15) as r:
                          body=r.read(); status=r.status; final=r.geturl()
                      actual=hashlib.sha256(body).hexdigest()
                      if status==200 and final.startswith('https://') and actual==item['sha256']:
                          return {'site':site,'path':item['path'],'ok':True,'status':status}
                      error='HTTP '+str(status)+' or hash mismatch'
                  except Exception as e: error=str(e)
                  if attempt<3:time.sleep(5)
              return {'site':site,'path':item['path'],'ok':False,'error':error}
          jobs=[(s['site'],s['url'],f) for s in manifest for f in s['files']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool: results=list(pool.map(check,jobs))
          print('PUBLIC_VERIFICATION_JSON='+json.dumps(results,separators=(',',':')))
          for s in manifest:
              values=[r for r in results if r['site']==s['site']]
              print(s['url']+' '+str(sum(r['ok'] for r in values))+'/'+str(len(values))+' files verified')
          raise SystemExit(0 if all(r['ok'] for r in results) else 1)
          PYVERIFY
